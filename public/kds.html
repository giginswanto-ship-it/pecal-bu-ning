<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layar Dapur (KDS) - Nasi Pecel Bu Ning's</title>
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="kds-container">

  <!-- KDS Header -->
  <header class="kds-header">
    <div class="kds-brand">
      <div style="background: #f59e0b; color: #78350f; width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem;">
        <i class="fa-solid fa-kitchen-set"></i>
      </div>
      <div>
        <h1>DAPUR PECEL BU NING'S</h1>
        <p style="font-size: 0.8rem; color: #94a3b8;">Kitchen Display System (KDS)</p>
      </div>
    </div>

    <!-- Filter Tabs -->
    <div class="kds-filter-tabs">
      <button class="filter-tab active" data-filter="all" onclick="setFilter('all')">Semua (<span id="countAll">0</span>)</button>
      <button class="filter-tab" data-filter="preparing" onclick="setFilter('preparing')">Disiapkan (<span id="countPrep">0</span>)</button>
      <button class="filter-tab" data-filter="ready" onclick="setFilter('ready')">Siap Diambil (<span id="countReadyKds">0</span>)</button>
    </div>

    <!-- Action Shortcuts -->
    <div style="display: flex; gap: 10px; align-items: center;">
      <a href="/pos.html" class="btn-icon" title="Buka Kasir POS" target="_blank">
        <i class="fa-solid fa-cash-register"></i>
      </a>
      <a href="/display.html" class="btn-icon" title="Buka Layar TV McD" target="_blank">
        <i class="fa-solid fa-tv"></i>
      </a>
      <button class="btn-icon" title="Refresh Data" onclick="loadKdsOrders()">
        <i class="fa-solid fa-rotate"></i>
      </button>
    </div>
  </header>

  <!-- KDS Orders Grid -->
  <main class="kds-grid" id="kdsGrid">
    <!-- Dynamic Cards generated by JavaScript -->
  </main>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/sound.js"></script>
  <script src="/js/kds.js"></script>
</body>
</html>
